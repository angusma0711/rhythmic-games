<!doctype html>
<html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>rhythmic games · 節奏拍奏</title>
<style>
[hidden]{display:none!important}*{box-sizing:border-box}
:root{--accent:#ff5d8f;--dark:#c2185b;--soft:#ffe3ee;--bg1:#ffd6e7;--bg2:#fff4c2;--ink:#1d1640;font-family:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;color:var(--ink)}
body{margin:0;min-height:100dvh;background:linear-gradient(150deg,var(--bg1),var(--bg2));transition:background .4s}
body[data-grade=P2]{--accent:#00b8a9;--dark:#00796f;--soft:#d5f7f3;--bg1:#b8f3ea;--bg2:#fff6c9}
body[data-grade=P3]{--accent:#ff7a1a;--dark:#c24f00;--soft:#ffe6d1;--bg1:#ffd4b0;--bg2:#fff2a8}
body[data-grade=P5]{--accent:#7c4dff;--dark:#5122c9;--soft:#ece4ff;--bg1:#d9caff;--bg2:#bfeaff}
button,select,input{font:inherit;color:inherit}button{cursor:pointer;font-weight:800;border:0;border-radius:18px;background:#fff;padding:12px 20px;box-shadow:0 5px 0 rgba(29,22,64,.18);transition:transform .08s,box-shadow .08s}button:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 rgba(29,22,64,.18)}button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:4px solid #ffcf33;outline-offset:3px}
/* home */
.grade-home{min-height:100dvh;max-width:1050px;margin:auto;padding:32px 24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;position:relative;overflow:hidden}
.grade-home::before,.grade-home::after{content:'♪';position:absolute;font-size:120px;color:rgba(255,255,255,.7);top:8%;left:6%;animation:float 6s ease-in-out infinite}.grade-home::after{content:'♫';top:auto;left:auto;bottom:8%;right:7%;font-size:150px;animation-delay:-3s}
@keyframes float{50%{transform:translateY(-22px) rotate(-8deg)}}
.brand{display:flex;align-items:center;gap:14px}.brand svg{width:72px;height:58px;color:#ff5d8f;filter:drop-shadow(0 4px 0 rgba(29,22,64,.15))}.grade-home h1{margin:0;font-size:clamp(38px,7vw,64px);letter-spacing:-1px}.grade-home h2{margin:0;font-size:24px;opacity:.75}
.grade-choices{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;width:100%;margin-top:8px;position:relative;z-index:1}
.grade-choices button{--c:#00b8a9;--d:#00796f;min-height:220px;border-radius:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:var(--c);color:#fff;box-shadow:0 10px 0 var(--d);transition:transform .15s}
.grade-choices button:hover{transform:translateY(-6px) rotate(-1deg)}#chooseP3{--c:#ff7a1a;--d:#c24f00}#chooseP5{--c:#7c4dff;--d:#5122c9}
.grade-choices strong{font-size:56px;line-height:1}.grade-choices span:last-child{font-size:22px;opacity:.95}.grade-icon{height:70px;color:#fff}.grade-icon svg{height:100%;width:auto;max-width:160px}
#gradePending{text-align:center}
/* game */
main{max-width:1180px;margin:auto;padding:14px 18px;height:100dvh;display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:center;gap:10px}.icon{width:52px;height:52px;padding:0;font-size:24px;display:grid;place-items:center;flex:none}
#gradeLabel{background:var(--accent);color:#fff;font-weight:900;font-size:22px;border-radius:999px;padding:8px 18px;box-shadow:0 4px 0 var(--dark);white-space:nowrap}
#dots{display:flex;gap:8px;flex-wrap:wrap;margin-left:6px}#dots button{width:42px;height:42px;padding:0;border-radius:50%;font-size:18px;box-shadow:0 4px 0 rgba(29,22,64,.15)}#dots button.current{background:var(--accent);color:#fff;box-shadow:0 4px 0 var(--dark);transform:scale(1.12)}
.spacer{flex:1}
#status{margin:0;text-align:center;font-size:clamp(28px,4.2vw,44px);font-weight:900;align-self:center;background:#fff;border-radius:999px;padding:6px 34px;box-shadow:0 6px 0 rgba(29,22,64,.12);min-width:min(420px,90%)}
#status[data-phase=count]{background:#ffcf33;font-size:clamp(40px,6vw,64px);padding:0 40px;animation:pop .3s}
#status[data-phase=guided]{background:var(--accent);color:#fff}#status[data-phase=independent]{background:var(--dark);color:#fff}#status[data-phase=done]{background:#ffcf33;animation:pop .4s}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.08)}}
#instruction,footer,.controls:not(.actions):not(.in-drawer){display:none}
#score{flex:1;min-height:220px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:16px}
.cell{background:#fff;border:5px solid var(--accent);border-radius:28px;box-shadow:0 8px 0 var(--dark);display:flex;align-items:center;justify-content:center;position:relative;min-height:0;transition:transform .12s,background .12s}
.cell svg{height:74%;width:88%;max-height:170px;color:var(--ink)}.cell.wide{grid-column:span 2}.cell.wide .pair-symbol{max-height:160px;width:95%}
.cell.active{background:#ffe14d;border-color:#ff9f1a;box-shadow:0 8px 0 #d97a00,0 0 0 8px rgba(255,225,77,.55);transform:translateY(-6px) scale(1.04);animation:bounce .25s}
@keyframes bounce{50%{transform:translateY(-10px) scale(1.07)}}
.beatno{position:absolute;top:8px;left:12px;font-size:16px;font-weight:900;color:#fff;background:var(--accent);border-radius:12px;padding:1px 9px}
.cell .label{position:absolute;bottom:8px;font-size:16px;font-weight:800;color:var(--dark)}.cell .syl{color:var(--accent)}
#progress{height:14px;background:rgba(255,255,255,.7);border-radius:8px;overflow:hidden;position:relative}#progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),#ffcf33);border-radius:8px}#progress::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(12.5% - 3px),rgba(255,255,255,.9) calc(12.5% - 3px) 12.5%)}
.actions{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}.actions button{font-size:22px;padding:14px 26px}
.primary{background:var(--accent);color:#fff;box-shadow:0 6px 0 var(--dark);font-size:26px!important;padding:14px 40px!important}
#message{min-height:0;margin:0;text-align:center;font-weight:700;color:#b3261e}#message:empty{display:none}
#confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}#confetti i{position:absolute;top:-20px;width:12px;height:18px;border-radius:3px;animation:fall 2.2s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
/* teacher drawer */
.settings{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:#fff;z-index:30;padding:18px 20px;overflow:auto;box-shadow:-10px 0 40px rgba(29,22,64,.25);color:#1d2b33;font-family:system-ui,sans-serif}
.settings:not([open]){display:none}.settings summary{list-style:none;cursor:pointer;font-weight:800;font-size:20px;margin-bottom:6px}.settings summary::-webkit-details-marker{display:none}
.settings fieldset{border:1px solid #d9dde3;border-radius:12px;margin:10px 0 0;padding:6px 12px 12px}.settings legend{font-weight:800;color:var(--dark);padding:0 6px}
.settings button,.settings select{box-shadow:none;border:2px solid #cfd6dd;border-radius:10px;padding:7px 12px;background:#fff}.settings .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:8px}.settings label{display:flex;align-items:center;gap:7px}.settings small{font-size:13px;color:#5b6770}
.settings input[type=number]{width:100px;padding:6px;border:1px solid #b9c2ca;border-radius:7px}.settings input[type=range]{width:130px}#file{max-width:290px}#fileInfo{font-size:14px;overflow-wrap:anywhere}
#calibrate.tapping{background:#ffcf33;border-color:#e0a800}.keys{font-size:13px;color:#5b6770;line-height:1.9}kbd{border:1px solid #b9c2ca;border-bottom-width:2px;border-radius:5px;padding:0 5px;font:inherit;background:#fff}
@media(max-height:820px){main{gap:9px;padding:10px 16px}#score{gap:12px}.actions button{font-size:19px;padding:10px 20px}.primary{font-size:22px!important;padding:10px 32px!important}}
@media(max-width:700px){.grade-choices{grid-template-columns:1fr;gap:16px}.grade-choices button{min-height:120px;flex-direction:row;gap:18px}.grade-choices strong{font-size:40px}.grade-icon{height:50px}.grade-home::before,.grade-home::after{font-size:70px}
main{height:auto;min-height:100dvh;padding:10px}header{flex-wrap:wrap;gap:8px}.icon{width:44px;height:44px;font-size:20px}#gradeLabel{font-size:17px;padding:6px 12px}#dots{order:5;width:100%;justify-content:center;margin:0}#dots button{width:38px;height:38px}
#score{height:330px;flex:none;gap:9px}.cell{border-width:4px;border-radius:18px;box-shadow:0 5px 0 var(--dark)}.beatno{font-size:12px;top:4px;left:6px;padding:0 6px}.cell .label{font-size:12px;bottom:4px}.actions{gap:6px;flex-wrap:nowrap}.actions button{font-size:15px;padding:10px 11px}.primary{font-size:17px!important;padding:10px 16px!important}}
body.projector main{max-width:none;padding:2vh 2.5vw;gap:1.6vh}body.projector #dots,body.projector #gear,body.projector #changeGrade{display:none}
body.projector #status{font-size:clamp(32px,6vh,80px)}body.projector #score{gap:2.4vh}body.projector .cell{border-width:7px}body.projector .cell svg{max-height:none}body.projector .beatno,body.projector .cell .label{font-size:clamp(16px,2.4vh,28px)}body.projector #progress{height:2vh}
</style>
<section id="gradeHome" class="grade-home"><div class="brand"><svg viewBox="0 0 80 64" fill="currentColor" aria-hidden="true"><ellipse cx="18" cy="50" rx="11" ry="8" transform="rotate(-18 18 50)"/><ellipse cx="60" cy="44" rx="11" ry="8" transform="rotate(-18 60 44)"/><path d="M28 49V10L70 4V43" stroke="currentColor" stroke-width="5" fill="none"/><path d="M28 10L70 4V13L28 19Z"/></svg><h1>rhythmic games</h1></div><h2>選擇年級</h2><div class="grade-choices"><button id="chooseP2"><span class="grade-icon" id="iconP2"></span><strong>P2</strong><span>小二</span></button><button id="chooseP3"><span class="grade-icon" id="iconP3"></span><strong>P3</strong><span>小三</span></button><button id="chooseP5"><span class="grade-icon" id="iconP5"></span><strong>P5</strong><span>小五</span></button></div><div id="gradePending" hidden role="status"><p>此年級未有題目。</p><button id="backHome">返回</button></div></section><main id="game" hidden><header><button id="changeGrade" class="icon" aria-label="更換年級" title="更換年級">←</button><span id="gradeLabel">P2</span><nav id="dots" aria-label="題目"></nav><span class="spacer"></span><button id="projector" class="icon" aria-pressed="false" aria-label="投影模式" title="投影模式（F）">⛶</button><button id="gear" class="icon" aria-label="教師設定" title="教師設定">⚙</button></header>
<p id="status" role="status" tabindex="-1">準備好就開始！</p><p id="instruction" hidden></p>
<div id="score" aria-label="八拍節奏譜，先讀上行四拍，再讀下行四拍"></div><div id="progress" aria-hidden="true"><i id="progressFill"></i></div>
<div class="controls actions"><button id="start" class="primary">▶ 開始</button><button id="stop" disabled>■ 停止</button><button id="repeat">↻ 再來</button><button id="next">下一題 →</button></div>
<p id="message" role="alert"></p><div id="confetti" aria-hidden="true"></div>
<details id="settings" class="settings"><summary>✕ 教師設定</summary><fieldset><legend>題目及音樂</legend><div class="controls in-drawer"><label>題目 <select id="question"></select></label><label>音樂 <select id="source"><option value="builtin">內建伴奏</option><option value="custom">自選音樂</option></select></label><span id="tempo">80 BPM</span></div>
<div id="builtin" class="controls in-drawer"><label>伴奏速度 <select id="builtinBpm"><option>60</option><option selected>80</option><option>100</option></select></label></div>
<div id="custom" hidden><div class="controls in-drawer"><label>音樂檔 <input id="file" type="file" accept=".mp3,.m4a,.wav,audio/*"></label><label>BPM <input id="customBpm" type="number" min="40" max="160" step="0.1" placeholder="40–160"></label><label>第一拍（秒） <input id="offset" type="number" min="0" step="0.01" placeholder="例如 0.35"></label><button id="preview">對拍試聽・8拍</button></div><p id="fileInfo">載入速度穩定的音樂，再設定 BPM 和第一拍位置。</p><small>試聽時調整拍子聲與音樂是否吻合；正式練習需要第一拍之後至少十六拍音樂。檔案只在本機處理。</small></div>
<div class="controls in-drawer"><label>伴奏音量 <input id="musicVolume" type="range" min="0" max="100" value="45"><output id="musicValue">45%</output></label><label>示範音量 <input id="demoVolume" type="range" min="0" max="100" value="65"><output id="demoValue">65%</output></label></div></fieldset><fieldset><legend>課室</legend><div class="controls in-drawer"><label><input id="syllables" type="checkbox"> 顯示節奏唸法</label></div>
<div class="controls in-drawer"><label>聲畫延遲 <input id="latency" type="range" min="0" max="400" step="5" value="0"><output id="latencyValue">0 ms</output></label><button id="calibrate">拍手校正</button></div><small id="calibInfo">用投影喇叭或藍牙時，亮格可能比聲音早。按「拍手校正」後，聽到拍子聲就按空白鍵或此按鈕，共 12 下；結果只保存在此裝置。</small></fieldset><fieldset><legend>快捷鍵（簡報筆可用）</legend><p class="keys"><kbd>空白鍵</kbd> 開始／停止 · <kbd>→</kbd><kbd>PgDn</kbd> 下一題 · <kbd>←</kbd><kbd>PgUp</kbd> 上一題 · <kbd>R</kbd> 再來 · <kbd>F</kbd> 投影模式</p><small>原創複習練習，由教師觀察拍奏表現，不自動評分。</small></fieldset></details></main>
<script>
'use strict';
const $=id=>document.getElementById(id);
const PATTERNS=[['ta','ta','ta','ta','ta','ta','ta','ta'],['ta','rest','ta','rest','ta','rest','ta','rest'],['ta','ti','ta','ti','ta','ti','ta','ti'],['ti','ta','ti','ta','ti','ta','ti','ta'],['ta','ti','ta','rest','ta','ti','ta','rest'],['ti','ta','rest','ti','ta','rest','ti','ta']].map((cells,i)=>({id:i+1,cells,beats:8,events:cells.flatMap((kind,b)=>kind==='ti'?[{startBeat:b,durationBeats:.5,kind:'note'},{startBeat:b+.5,durationBeats:.5,kind:'note'}]:[{startBeat:b,durationBeats:1,kind:kind==='rest'?'rest':'note'}])}));
function makePattern(cells,id){let offset=0;const segments=cells.map(kind=>{const span=kind==='half'||kind==='dottedPair'?2:1,segment={kind,startBeat:offset,durationBeats:span};offset+=span;return segment});return {id,cells,beats:offset,segments,events:segments.flatMap(s=>{const on=ONSETS[s.kind];return on?on.map((o,i)=>({startBeat:s.startBeat+o,durationBeats:(on[i+1]??s.durationBeats)-o,kind:'note'})):[{startBeat:s.startBeat,durationBeats:s.durationBeats,kind:s.kind==='rest'?'rest':'note'}]})}}
const ONSETS={ti:[0,.5],dottedPair:[0,1.5],titiri:[0,.5,.75],tim:[0,.75],tiri:[0,.25,.5,.75]};
const P2=PATTERNS.map(p=>makePattern(p.cells,p.id));
const P3=[['half','half','half','half'],['ta','ta','half','ta','ta','half'],['dottedPair','half','dottedPair','half'],['ta','ta','dottedPair','half','ta','ta'],['half','dottedPair','ta','ta','dottedPair'],['dottedPair','dottedPair','half','dottedPair']].map((cells,i)=>makePattern(cells,i+1));
const P5=[['ti','tiri','ti','ta','ti','tiri','ti','ta'],['ta','titiri','ta','titiri','ti','titiri','ta','ta'],['tim','ta','tim','ta','ti','tim','ti','ta'],['ti','titiri','tiri','ta','ti','titiri','tiri','ta'],['tiri','tim','titiri','ta','tiri','tim','ti','ta'],['titiri','tim','tiri','ti','tim','titiri','tiri','ta']].map((cells,i)=>makePattern(cells,i+1));
const GRADES={P2:{label:'P2 · 小二',patterns:P2},P3:{label:'P3 · 小三',patterns:P3},P5:{label:'P5 · 小五',patterns:P5}};let grade=null;
function library(){return grade?GRADES[grade].patterns:[]}
function selectGrade(value){stop();grade=value;if(document.body)document.body.dataset.grade=value;$('message').textContent='';const pending=library().length===0;$('gradeHome').hidden=!pending;$('game').hidden=pending;$('gradePending').hidden=!pending;document.querySelector('.grade-choices').hidden=pending;$('gradeLabel').textContent=value;$('question').innerHTML='';library().forEach(p=>$('question').add(new Option(`第 ${p.id} 題`,p.id)));$('question').selectedIndex=0;if(!pending){render();$('status').textContent='準備好就開始！';$('status').focus()}updateTempo()}
function goHome(){stop();grade=null;if(document.body)delete document.body.dataset.grade;$('game').hidden=true;$('gradeHome').hidden=false;$('gradePending').hidden=true;document.querySelector('.grade-choices').hidden=false}
let ctx,musicBus,demoBus,cueBus,noiseBuffer,audioBuffer=null,run=null,raf=0,serial=0,loadSerial=0,loading=false;const voices=new Set();
function glyph(k){if(k==='half')return '<svg viewBox="0 0 110 90" aria-hidden="true"><ellipse cx="50" cy="61" rx="11" ry="8" transform="rotate(-18 50 61)" fill="white" stroke="currentColor" stroke-width="3"/><path d="M60 60V13" stroke="currentColor" stroke-width="4"/></svg>';if(k==='dottedPair')return '<svg class="pair-symbol" viewBox="0 0 220 90" fill="currentColor" aria-hidden="true"><ellipse cx="42" cy="61" rx="11" ry="8" transform="rotate(-18 42 61)"/><path d="M52 60V13" stroke="currentColor" stroke-width="4"/><circle cx="65" cy="59" r="4"/><ellipse cx="172" cy="61" rx="11" ry="8" transform="rotate(-18 172 61)"/><path d="M182 60V13" stroke="currentColor" stroke-width="4"/><path d="M182 13C180 26 208 25 192 49C201 29 180 31 182 13Z"/></svg>';const note=x=>`<ellipse cx="${x}" cy="61" rx="11" ry="8" transform="rotate(-18 ${x} 61)"/><path d="M${x+10} 60V13" stroke="currentColor" stroke-width="4"/>`;const beam=(a,b,y)=>`<path d="M${a} ${y}H${b}" stroke="currentColor" stroke-width="7"/>`;if(k==='titiri')return `<svg viewBox="0 0 110 90" aria-hidden="true" fill="currentColor">${note(22)+note(55)+note(88)+beam(31,99,13)+beam(64,99,25)}</svg>`;if(k==='tim')return `<svg viewBox="0 0 110 90" aria-hidden="true" fill="currentColor">${note(26)+note(80)+'<circle cx="43" cy="59" r="4"/>'+beam(35,91,13)+beam(76,91,25)}</svg>`;if(k==='tiri')return `<svg viewBox="0 0 110 90" aria-hidden="true" fill="currentColor">${note(14)+note(39)+note(64)+note(89)+beam(23,100,13)+beam(23,100,25)}</svg>`;return `<svg viewBox="0 0 110 90" aria-hidden="true" fill="currentColor">${k==='rest'?'<path d="M58 6L44 27L61 42L48 56Q73 52 55 79Q82 54 62 48L73 36L54 22L65 8Z"/>':k==='ti'?note(29)+note(73)+'<path d="M39 13H83" stroke="currentColor" stroke-width="7"/>':note(50)}</svg>`}
function pattern(){return library()[$('question').selectedIndex]}
const SYL={ta:'ta',ti:'ti-ti',rest:'（休）',half:'ta-a',dottedPair:'ta-i ti',titiri:'ti-tiri',tim:'tim-ri',tiri:'tiri-tiri'};
function render(){renderDots();const p=pattern(),syl=!!$('syllables').checked;$('score').innerHTML=p?p.segments.map(s=>{const b=s.startBeat%4+1,two=s.durationBeats===2,dur=two?(s.kind==='half'?'2 拍 · 只拍一下':'1½ 拍 ＋ ½ 拍'):'',label=[syl?`<span class="syl">${SYL[s.kind]}</span>`:'',dur].filter(Boolean).join(' · ');return `<div class="cell ${two?'wide':''}" aria-label="第 ${s.startBeat+1} 拍起：${({ta:'四分音符，一拍',ti:'兩個八分音符，共一拍',rest:'四分休止符，一拍',half:'二分音符，兩拍，只拍一次',dottedPair:'附點四分音符接八分音符，共兩拍',titiri:'八分音符接兩個十六分音符，共一拍',tim:'附點八分音符接十六分音符，共一拍',tiri:'四個十六分音符，共一拍'})[s.kind]}"><span class="beatno" aria-hidden="true">${two?b+'–'+(b+1):b}</span>${glyph(s.kind)}${label?`<span class="label">${label}</span>`:''}</div>`}).join(''):''}
function bpm(){return Number($('source').value==='builtin'?$('builtinBpm').value:$('customBpm').value)}
function updateTempo(){const n=bpm();$('tempo').textContent=Number.isFinite(n)&&n>0?`${n} BPM`:'先設定速度'}
function lock(v){for(const id of ['latency','calibrate','question','source','builtinBpm','customBpm','offset','file','musicVolume','demoVolume','start','repeat','next','preview'])$(id).disabled=v||loading;$('stop').disabled=!v;const d=$('dots');if(d.querySelectorAll)d.querySelectorAll('button').forEach(b=>b.disabled=v)}
async function audioReady(){if(!ctx){ctx=new(window.AudioContext||window.webkitAudioContext)();musicBus=ctx.createGain();demoBus=ctx.createGain();cueBus=ctx.createGain();for(const b of [musicBus,demoBus,cueBus])b.connect(ctx.destination);musicBus.gain.value=Number($('musicVolume').value)/100;demoBus.gain.value=Number($('demoVolume').value)/100;cueBus.gain.value=.32;noiseBuffer=ctx.createBuffer(1,Math.ceil(ctx.sampleRate*.12),ctx.sampleRate);let data=noiseBuffer.getChannelData(0);let seed=32;for(let i=0;i<data.length;i++){seed=(seed*16807)%2147483647;data[i]=seed/1073741824-1}ctx.onstatechange=()=>{if(run&&ctx.state!=='running')stop('音訊已中斷，按開始重新預備。')}}await ctx.resume();if(ctx.state!=='running')throw Error('聲音未能啟動，請再按開始。')}
function track(node){voices.add(node);node.onended=()=>voices.delete(node);return node}
function tone(at,hz,duration,amp,bus,type='sine',endHz=null){let o=track(ctx.createOscillator()),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(hz,at);if(endHz)o.frequency.exponentialRampToValueAtTime(endHz,at+Math.min(duration,.12));g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(amp,at+.006);g.gain.exponentialRampToValueAtTime(.0001,at+duration);o.connect(g).connect(bus);o.start(at);o.stop(at+duration+.01)}

function detune(at,hz,duration,amp,bus,type){tone(at,hz*1.0023,duration,amp,bus,type);tone(at,hz/1.0023,duration,amp,bus,type)}
function emit(e,at,spb){if(e.type==='cue'){tone(at,e.accent?1760:1320,.06,.32,cueBus,'triangle',e.accent?1400:1050);tone(at,e.accent?880:660,.03,.12,cueBus,'square')}

const CHORDS=[[261.63,329.63,392],[220,261.63,329.63],[174.61,220,261.63],[196,246.94,293.66]],BASS=[130.81,110,87.31,98];
function groove(g,b,start){const k=Math.floor(b/4)%4,at=start+b,ev=[];
if(g==='P3'){if(b%2===0)ev.push({beat:at,type:'kick',amp:.8});else ev.push({beat:at,type:'snare',amp:.6});ev.push({beat:at,type:'hat',amp:.04});if(b%4===0)ev.push({beat:at,type:'bass',hz:BASS[k],len:1.8},{beat:at+2,type:'bass',hz:BASS[k],len:1.8},{beat:at,type:'chord',notes:CHORDS[k],len:3.9,amp:.04,wave:'triangle'});return ev}

function timeline(p,spb,custom=false,preview=false){let events=[];if(!preview)for(let b=0;b<4;b++)events.push({beat:b,type:'cue',accent:b===0});let start=preview?0:4,length=preview?8:16;if(preview)for(let b=0;b<8;b++)events.push({beat:b,type:'cue',accent:b%4===0});if(!custom)for(let b=0;b<length;b++)events.push(...groove(grade,b,start));

function validate(custom,beats){let n=bpm();if(!Number.isFinite(n)||n<40||n>160)throw Error('請設定 40–160 之間的 BPM。');let offset=Number($('offset').value);if(custom){if(loading)throw Error('音樂仍在載入，請稍候。');if(!audioBuffer)throw Error('請先載入音樂檔。');if(!$('customBpm').value||!$('offset').value||!Number.isFinite(offset)||offset<0)throw Error('請設定 BPM 及第一拍時間（可填 0）。');if(audioBuffer.duration-offset+1e-7<beats*60/n)throw Error(`第一拍之後不足 ${beats} 拍音樂，請調整第一拍位置或更換檔案。`)}return {spb:60/n,offset}}
function clearHighlight(){document.querySelectorAll('.cell').forEach(c=>c.classList.remove('active'))}
function stop(message='已停止'){serial++;cancelAnimationFrame(raf);run=null;voices.forEach(n=>{try{n.stop()}catch{}});voices.clear();clearHighlight();lock(false);setPhase(message.includes('完成')?'done':'');setProgress(0);$('status').textContent=message;$('instruction').textContent='先跟着拍一次，再跟音樂自己拍一次。'}
async function begin(preview=false){if(!pattern())return;stop();updateTempo();$('message').textContent='';const token=serial,custom=$('source').value==='custom';try{if(preview&&!custom)throw Error('對拍試聽只適用於自選音樂。');const cfg=validate(custom,preview?8:16);lock(true);await audioReady();if(token!==serial)return;const origin=ctx.currentTime+.15;run={pattern:pattern(),origin,spb:cfg.spb,preview,end:preview?8:20,events:timeline(pattern(),cfg.spb,custom,preview)};if(custom){let node=track(ctx.createBufferSource());node.buffer=audioBuffer;node.connect(musicBus);node.start(origin+(preview?0:4*cfg.spb),cfg.offset,(preview?8:16)*cfg.spb)}$('settings').open=false;frame()}catch(e){if(token!==serial)return;stop('尚未開始');$('message').textContent=e.message||'未能播放音樂，請重新載入。';$('settings').open=custom}}
function phase(t,preview=false){t+=1e-7;return preview?'preview':t<0?'ready':t<4?'count':t<12?'guided':t<20?'independent':'done'}

async function loadFile(){stop('正在載入音樂…');let id=++loadSerial,file=$('file').files[0];audioBuffer=null;$('customBpm').value='';$('offset').value='';updateTempo();$('message').textContent='';$('fileInfo').textContent='';if(!file){$('status').textContent='準備好就開始！';return}loading=true;lock(false);try{await audioReady();const bytes=await file.arrayBuffer();let buffer=await ctx.decodeAudioData(bytes);if(id!==loadSerial)return;audioBuffer=buffer;$('fileInfo').textContent=`${file.name} · ${buffer.duration.toFixed(2)} 秒；請重新設定 BPM 和第一拍位置。`;$('status').textContent='音樂已載入 · 請設定並試聽'}catch(e){if(id!==loadSerial)return;$('message').textContent='無法解碼這個音樂檔，請改用瀏覽器支援的 MP3、M4A 或 WAV。';$('status').textContent='音樂未能載入'}finally{if(id===loadSerial){loading=false;lock(false)}}}
$('start').onclick=()=>begin();$('repeat').onclick=()=>begin();$('stop').onclick=()=>stop();$('preview').onclick=()=>begin(true);$('next').onclick=()=>{stop('準備好就開始！');$('question').selectedIndex=($('question').selectedIndex+1)%library().length;render()};$('question').onchange=()=>{stop('準備好就開始！');render()};$('source').onchange=()=>{stop('準備好就開始！');const custom=$('source').value==='custom';$('custom').hidden=!custom;$('builtin').hidden=custom;$('settings').open=custom;updateTempo()};$('file').onchange=loadFile;$('customBpm').oninput=updateTempo;for(let id of ['builtinBpm','customBpm','offset'])$(id).onchange=()=>{stop('設定已更新');updateTempo()};for(let [id,bus,label] of [['musicVolume',()=>musicBus,'musicValue'],['demoVolume',()=>demoBus,'demoValue']])$(id).oninput=()=>{$(label).textContent=$(id).value+'%';if(bus())bus().gain.value=Number($(id).value)/100};document.addEventListener('visibilitychange',()=>{if(document.hidden)stop('已停止')});window.addEventListener('pagehide',()=>stop());for(const key of ['P2','P3','P5'])$('choose'+key).onclick=()=>selectGrade(key);$('changeGrade').onclick=goHome;$('backHome').onclick=goHome;updateTempo();
function setPhase(v){const st=$('status');if(st.dataset)st.dataset.phase=v}
const LATENCY_KEY='rhythmic-games.latencyMs';function latency(){return (Number($('latency').value)||0)/1000}
function setLatency(ms,save=true){ms=Math.max(0,Math.min(400,Math.round(ms/5)*5));$('latency').value=String(ms);$('latencyValue').textContent=ms+' ms';if(save)try{localStorage.setItem(LATENCY_KEY,String(ms))}catch{}}
try{const saved=localStorage.getItem(LATENCY_KEY);if(saved!==null)setLatency(Number(saved),false)}catch{}
$('latency').oninput=()=>setLatency(Number($('latency').value));
let cal=null;
async function calibrate(){stop('拍手校正中 · 聽到拍子聲就按');try{await audioReady()}catch(e){$('message').textContent=e.message;return}const token=serial,spb=60/90,origin=ctx.currentTime+.6,count=12;cal={token,spb,taps:[],perfOrigin:performance.now()+(origin-ctx.currentTime)*1000};for(let i=0;i<count;i++)tone(origin+i*spb,i%4===0?1000:750,.08,.4,cueBus,'triangle');lock(true);$('stop').disabled=false;$('calibrate').disabled=false;$('calibrate').classList.add('tapping');$('calibrate').textContent='聽到就按';setTimeout(()=>finishCalibration(token),(origin-ctx.currentTime+count*spb+.6)*1000)}
function calTap(){if(!cal)return;const ms=performance.now()-cal.perfOrigin,step=cal.spb*1000,i=Math.floor((ms+150)/step);if(i>=2&&i<12)cal.taps.push(ms-i*step)}

const baseStop=stop;stop=function(message){if(cal){cal=null;$('calibrate').classList.remove('tapping');$('calibrate').textContent='拍手校正'}return baseStop(message)};
$('calibrate').onclick=()=>cal?calTap():calibrate();
function toggleProjector(force){const on=force??!document.body.classList.contains('projector');document.body.classList.toggle('projector',on);$('projector').setAttribute('aria-pressed',String(on));const fs=document.fullscreenElement||document.webkitFullscreenElement;if(on&&!fs){const el=document.documentElement,req=el.requestFullscreen||el.webkitRequestFullscreen;if(req)Promise.resolve(req.call(el)).catch(()=>{})}else if(!on&&fs){const exit=document.exitFullscreen||document.webkitExitFullscreen;if(exit)Promise.resolve(exit.call(document)).catch(()=>{})}}

document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey||e.repeat&&e.key!==' ')return;const tag=(e.target&&e.target.tagName)||'';if(/INPUT|SELECT|TEXTAREA/.test(tag)&&e.target.type!=='range')return;if(tag==='BUTTON'&&e.key==='Enter')return;if(cal){if(e.key===' '||e.key==='Enter'){e.preventDefault();calTap()}else if(e.key==='Escape')stop();return}if($('game').hidden)return;const k=e.key;let handled=true;
