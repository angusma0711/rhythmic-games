<section id="gradeHome" class="grade-home"><h1>rhythmic games</h1><h2>選擇年級</h2><p>看節奏譜，跟音樂拍奏</p><div class="grade-choices"><button id="chooseP2"><strong>P2 · 小二</strong><span>四分音符、成對八分及休止</span></button><button id="chooseP3"><strong>P3 · 小三</strong><span>二分、四分、附點四分＋八分</span></button><button id="chooseP5"><strong>P5 · 小五</strong><span>八分、十六分、附點及四分節奏型</span></button></div><div id="gradePending" hidden role="status"><p>P5 題庫待設定，請提供考試節奏範圍。</p><button id="backHome">返回年級選擇</button></div></section><main id="game" hidden><header><h1>rhythmic games</h1><small><span id="gradeLabel">音樂讀譜拍奏</span> <button id="changeGrade">更換年級</button></small></header>
<div class="controls"><label>題目 <select id="question"></select></label><label>音樂 <select id="source"><option value="builtin">內建伴奏</option><option value="custom">自選音樂</option></select></label><span id="tempo">80 BPM</span><label class="assist-control"><input id="assistance" type="checkbox">輔助模式 · 跟音光點</label></div>
<p id="status" role="status" tabindex="-1">先看譜，準備好才開始</p><p id="instruction">先跟着拍一次，再跟音樂自己拍一次。</p>
<div id="score" aria-label="八拍節奏譜，先讀上行四拍，再讀下行四拍"></div>
<div class="controls actions"><button id="start" class="primary">開始</button><button id="stop" disabled>停止</button><button id="repeat">再練一次</button><button id="next">下一題 →</button></div>
<details id="settings" class="settings"><summary>教師音樂設定</summary>
<div id="builtin" class="controls"><label>伴奏速度 <select id="builtinBpm"><option>60</option><option selected>80</option><option>100</option></select></label></div>
<div id="custom" hidden><div class="controls"><label>音樂檔 <input id="file" type="file" accept=".mp3,.m4a,.wav,audio/*"></label><label>BPM <input id="customBpm" type="number" min="40" max="160" step="0.1" placeholder="40–160"></label><label>第一拍（秒） <input id="offset" type="number" min="0" step="0.01" placeholder="例如 0.35"></label><button id="preview">對拍試聽・8拍</button></div><p id="fileInfo">載入速度穩定的音樂，再設定 BPM 和第一拍位置。</p><small>試聽時調整拍子聲與音樂是否吻合；正式練習需要第一拍之後至少十六拍音樂。檔案只在本機處理。</small></div>
<div class="controls"><label>伴奏音量 <input id="musicVolume" type="range" min="0" max="100" value="45"><output id="musicValue">45%</output></label><label>示範音量 <input id="demoVolume" type="range" min="0" max="100" value="65"><output id="demoValue">65%</output></label></div></details>
<p id="message" role="alert"></p><footer>原創複習練習 · 休止保留一拍 · 由教師觀察拍奏表現，不自動評分。</footer></main>
<script>
'use strict';
const $=id=>document.getElementById(id);
const PATTERNS=[['ta','ta','ta','ta','ta','ta','ta','ta'],['ta','rest','ta','rest','ta','rest','ta','rest'],['ta','ti','ta','ti','ta','ti','ta','ti'],['ti','ta','ti','ta','ti','ta','ti','ta'],['ta','ti','ta','rest','ta','ti','ta','rest'],['ti','ta','rest','ti','ta','rest','ti','ta']].map((cells,i)=>({id:i+1,cells,beats:8,events:cells.flatMap((kind,b)=>kind==='ti'?[{startBeat:b,durationBeats:.5,kind:'note'},{startBeat:b+.5,durationBeats:.5,kind:'note'}]:[{startBeat:b,durationBeats:1,kind:kind==='rest'?'rest':'note'}])}));
function makePattern(cells,id){let offset=0;const segments=cells.map(kind=>{const span=kind==='half'||kind==='dottedPair'?2:1,segment={kind,startBeat:offset,durationBeats:span};offset+=span;return segment});return {id,cells,beats:offset,segments,events:segments.flatMap(s=>s.kind==='eighthSixteenths'?[{startBeat:s.startBeat,durationBeats:.5,kind:'note'},{startBeat:s.startBeat+.5,durationBeats:.25,kind:'note'},{startBeat:s.startBeat+.75,durationBeats:.25,kind:'note'}]:s.kind==='dottedEighth'?[{startBeat:s.startBeat,durationBeats:.75,kind:'note'},{startBeat:s.startBeat+.75,durationBeats:.25,kind:'note'}]:s.kind==='fourSixteenths'?[0,.25,.5,.75].map(b=>({startBeat:s.startBeat+b,durationBeats:.25,kind:'note'})):s.kind==='dottedPair'?[{startBeat:s.startBeat,durationBeats:1.5,kind:'note'},{startBeat:s.startBeat+1.5,durationBeats:.5,kind:'note'}]:s.kind==='ti'?[{startBeat:s.startBeat,durationBeats:.5,kind:'note'},{startBeat:s.startBeat+.5,durationBeats:.5,kind:'note'}]:[{startBeat:s.startBeat,durationBeats:s.durationBeats,kind:s.kind==='rest'?'rest':'note'}])}}
const P2=PATTERNS.map(p=>makePattern(p.cells,p.id));
const P3=[['half','half','half','half'],['ta','ta','half','ta','ta','half'],['dottedPair','half','dottedPair','half'],['ta','ta','dottedPair','half','ta','ta'],['half','dottedPair','ta','ta','dottedPair'],['dottedPair','dottedPair','half','dottedPair']].map((cells,i)=>makePattern(cells,i+1));
const P5=[['ta','ti','ta','ti','ta','ti','ta','ti'],['eighthSixteenths','ta','eighthSixteenths','ta','eighthSixteenths','ta','eighthSixteenths','ta'],['dottedEighth','ta','dottedEighth','ta','dottedEighth','ta','dottedEighth','ta'],['fourSixteenths','ta','fourSixteenths','ta','fourSixteenths','ta','fourSixteenths','ta'],['eighthSixteenths','ti','dottedEighth','ta','eighthSixteenths','ti','dottedEighth','ta'],['eighthSixteenths','fourSixteenths','dottedEighth','ti','ta','dottedEighth','fourSixteenths','ta']].map((cells,i)=>makePattern(cells,i+1));
const GRADES={P2:{label:'P2 · 小二',patterns:P2},P3:{label:'P3 · 小三',patterns:P3},P5:{label:'P5 · 小五',patterns:P5}};let grade=null;
function library(){return grade?GRADES[grade].patterns:[]}
function selectGrade(value){stop();grade=value;$('message').textContent='';const pending=library().length===0;$('gradeHome').hidden=!pending;$('game').hidden=pending;$('gradePending').hidden=!pending;document.querySelector('.grade-choices').hidden=pending;$('gradeLabel').textContent=GRADES[value].label;$('question').innerHTML='';library().forEach(p=>$('question').add(new Option(`第 ${p.id} 題`,p.id)));$('question').selectedIndex=0;if(!pending){render();$('status').textContent='先看譜，準備好才開始';$('status').focus()}updateTempo()}
function goHome(){stop();grade=null;$('game').hidden=true;$('gradeHome').hidden=false;$('gradePending').hidden=true;document.querySelector('.grade-choices').hidden=false}
let ctx,musicBus,demoBus,cueBus,noiseBuffer,audioBuffer=null,run=null,raf=0,serial=0,loadSerial=0,loading=false;const voices=new Set();
function glyph(k){if(['eighthSixteenths','dottedEighth','fourSixteenths'].includes(k)){let xs=k==='fourSixteenths'?[15,40,65,90]:k==='eighthSixteenths'?[18,52,86]:[25,82],radius=k==='fourSixteenths'?7:9,stem=radius-1,heads=xs.map(x=>`<ellipse cx="${x}" cy="61" rx="${radius}" ry="6" transform="rotate(-18 ${x} 61)"/><path d="M${x+stem} 60V13" stroke="currentColor" stroke-width="3"/>`).join(''),secondaryStart=k==='fourSixteenths'?xs[0]+stem:k==='eighthSixteenths'?xs[1]+stem:xs[1]+stem-13;return `<svg viewBox="0 0 110 90" aria-hidden="true" fill="currentColor">${heads}<path d="M${xs[0]+stem} 13H${xs.at(-1)+stem}M${secondaryStart} 23H${xs.at(-1)+stem}" stroke="currentColor" stroke-width="5"/>${k==='dottedEighth'?'<circle cx="43" cy="59" r="3.5"/>':''}</svg>`}if(k==='half')return '<svg viewBox="0 0 110 90" aria-hidden="true"><ellipse cx="50" cy="61" rx="11" ry="8" transform="rotate(-18 50 61)" fill="white" stroke="currentColor" stroke-width="3"/><path d="M60 60V13" stroke="currentColor" stroke-width="4"/></svg>';if(k==='dottedPair')return '<svg class="pair-symbol" viewBox="0 0 220 90" fill="currentColor" aria-hidden="true"><ellipse cx="42" cy="61" rx="11" ry="8" transform="rotate(-18 42 61)"/><path d="M52 60V13" stroke="currentColor" stroke-width="4"/><circle cx="65" cy="59" r="4"/><ellipse cx="172" cy="61" rx="11" ry="8" transform="rotate(-18 172 61)"/><path d="M182 60V13" stroke="currentColor" stroke-width="4"/><path d="M182 13C180 26 208 25 192 49C201 29 180 31 182 13Z"/></svg>';const note=x=>`<ellipse cx="${x}" cy="61" rx="11" ry="8" transform="rotate(-18 ${x} 61)"/><path d="M${x+10} 60V13" stroke="currentColor" stroke-width="4"/>`;return `<svg viewBox="0 0 110 90" aria-hidden="true" fill="currentColor">${k==='rest'?'<path d="M58 6L44 27L61 42L48 56Q73 52 55 79Q82 54 62 48L73 36L54 22L65 8Z"/>':k==='ti'?note(29)+note(73)+'<path d="M39 13H83" stroke="currentColor" stroke-width="7"/>':note(50)}</svg>`}
function pattern(){return library()[$('question').selectedIndex]}
const NOTE_X={ta:[50],ti:[29,73],rest:[],half:[50],dottedPair:[42,172],eighthSixteenths:[18,52,86],dottedEighth:[25,82],fourSixteenths:[15,40,65,90]};
function assistedGlyph(kind){return glyph(kind).replace('</svg>','<circle class="note-cue" cx="0" cy="78" r="5.5"/></svg>')}
function assistanceCue(p,local){if(local<0||local>=p.beats)return null;let segmentIndex=p.segments.findIndex(s=>local+1e-7>=s.startBeat&&local+1e-7<s.startBeat+s.durationBeats);if(segmentIndex<0)return null;let s=p.segments[segmentIndex];if(s.kind==='rest')return null;let notes=p.events.filter(e=>e.kind==='note'&&e.startBeat>=s.startBeat&&e.startBeat<s.startBeat+s.durationBeats),noteIndex=notes.findLastIndex(e=>e.startBeat<=local+1e-7);if(noteIndex<0)return null;return {segmentIndex,noteIndex,x:NOTE_X[s.kind][noteIndex],ageBeats:Math.max(0,local-notes[noteIndex].startBeat)}}
function showAssistance(p,local,enabled){let cue=enabled?assistanceCue(p,local):null;document.querySelectorAll('.cell').forEach((cell,i)=>{const active=!!cue&&cue.segmentIndex===i;cell.classList.toggle('assisting',active);if(active){const marker=cell.querySelector('.note-cue');if(marker){marker.setAttribute('cx',cue.x);marker.setAttribute('opacity',cue.ageBeats<.12?'1':'.65')}}})}
function render(){const p=pattern();$('score').innerHTML=p?p.segments.map(s=>`<div class="cell ${s.durationBeats===2?'wide':''}" aria-label="第 ${s.startBeat+1} 拍起：${({ta:'四分音符，一拍',ti:'兩個八分音符，共一拍',rest:'四分休止符，一拍',half:'二分音符，兩拍，只拍一次',dottedPair:'附點四分音符接八分音符，共兩拍',eighthSixteenths:'一個八分接兩個十六分音符，共一拍',dottedEighth:'附點八分接十六分音符，共一拍',fourSixteenths:'四個十六分音符，共一拍'})[s.kind]}">${assistedGlyph(s.kind)}${s.durationBeats===2?`<span class="duration">${s.kind==='half'?'2 拍 · 只拍一下':'1½ 拍 ＋ ½ 拍'}</span>`:''}</div>`).join(''):''}
function bpm(){return Number($('source').value==='builtin'?$('builtinBpm').value:$('customBpm').value)}
function updateTempo(){const n=bpm();$('tempo').textContent=Number.isFinite(n)&&n>0?`${n} BPM`:'先設定速度'}
function lock(v){for(const id of ['question','source','builtinBpm','customBpm','offset','file','musicVolume','demoVolume','start','repeat','next','preview','assistance'])$(id).disabled=v||loading;$('stop').disabled=!v}
async function audioReady(){if(!ctx){ctx=new(window.AudioContext||window.webkitAudioContext)();musicBus=ctx.createGain();demoBus=ctx.createGain();cueBus=ctx.createGain();for(const b of [musicBus,demoBus,cueBus])b.connect(ctx.destination);musicBus.gain.value=Number($('musicVolume').value)/100;demoBus.gain.value=Number($('demoVolume').value)/100;cueBus.gain.value=.32;noiseBuffer=ctx.createBuffer(1,Math.ceil(ctx.sampleRate*.12),ctx.sampleRate);let data=noiseBuffer.getChannelData(0);let seed=32;for(let i=0;i<data.length;i++){seed=(seed*16807)%2147483647;data[i]=seed/1073741824-1}ctx.onstatechange=()=>{if(run&&ctx.state!=='running')stop('音訊已中斷，按開始重新預備。')}}await ctx.resume();if(ctx.state!=='running')throw Error('聲音未能啟動，請再按開始。')}
function track(node){voices.add(node);node.onended=()=>voices.delete(node);return node}
function tone(at,hz,duration,amp,bus,type='sine',endHz=null){let o=track(ctx.createOscillator()),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(hz,at);if(endHz)o.frequency.exponentialRampToValueAtTime(endHz,at+Math.min(duration,.12));g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(amp,at+.006);g.gain.exponentialRampToValueAtTime(.0001,at+duration);o.connect(g).connect(bus);o.start(at);o.stop(at+duration+.01)}
function hiss(at,amp){let n=track(ctx.createBufferSource()),g=ctx.createGain(),f=ctx.createBiquadFilter();n.buffer=noiseBuffer;f.type='highpass';f.frequency.value=6000;g.gain.setValueAtTime(amp,at);g.gain.exponentialRampToValueAtTime(.0001,at+.065);n.connect(f).connect(g).connect(musicBus);n.start(at);n.stop(at+.08)}
function emit(e,at,spb){if(e.type==='cue')tone(at,e.accent?1000:750,.08,.25,cueBus,'triangle');if(e.type==='demo')tone(at,190,.14,.5,demoBus,'sine',70);if(e.type==='kick')tone(at,110,.15,.36,musicBus,'sine',45);if(e.type==='hat')hiss(at,.065);if(e.type==='snare')tone(at,230,.09,.13,musicBus,'triangle',120);if(e.type==='bass')tone(at,e.hz,spb*.7,.17,musicBus,'triangle');if(e.type==='chord')e.notes.forEach(hz=>tone(at,hz,spb*3.65,.042,musicBus,'sine'))}
function timeline(p,spb,custom=false,preview=false){let events=[];if(!preview)for(let b=0;b<4;b++)events.push({beat:b,type:'cue',accent:b===0});let start=preview?0:4,length=preview?8:16;if(preview)for(let b=0;b<8;b++)events.push({beat:b,type:'cue',accent:b%4===0});if(!custom){const chords=[[261.63,329.63,392],[220,261.63,329.63],[174.61,220,261.63],[196,246.94,293.66]],bass=[130.81,110,87.31,98];for(let b=0;b<length;b++){let k=Math.floor(b/4)%4;events.push({beat:start+b,type:b%2===0?'kick':'snare'},{beat:start+b,type:'hat'},{beat:start+b+.5,type:'hat'});if(b%2===0)events.push({beat:start+b,type:'bass',hz:bass[k]});if(b%4===0)events.push({beat:start+b,type:'chord',notes:chords[k]})}}
if(!preview)p.events.filter(e=>e.kind==='note').forEach(e=>events.push({beat:4+e.startBeat,type:'demo'}));return events.map(e=>({...e,time:e.beat*spb,done:false})).sort((a,b)=>a.time-b.time)}
function validate(custom,beats){let n=bpm();if(!Number.isFinite(n)||n<40||n>160)throw Error('請設定 40–160 之間的 BPM。');let offset=Number($('offset').value);if(custom){if(loading)throw Error('音樂仍在載入，請稍候。');if(!audioBuffer)throw Error('請先載入音樂檔。');if(!$('customBpm').value||!$('offset').value||!Number.isFinite(offset)||offset<0)throw Error('請設定 BPM 及第一拍時間（可填 0）。');if(audioBuffer.duration-offset+1e-7<beats*60/n)throw Error(`第一拍之後不足 ${beats} 拍音樂，請調整第一拍位置或更換檔案。`)}return {spb:60/n,offset}}
function clearHighlight(){document.querySelectorAll('.cell').forEach(c=>{c.classList.remove('active');c.classList.remove('assisting')})}
function stop(message='已停止 · 按開始重新預備'){serial++;cancelAnimationFrame(raf);run=null;voices.forEach(n=>{try{n.stop()}catch{}});voices.clear();clearHighlight();lock(false);$('status').textContent=message;$('instruction').textContent='先跟着拍一次，再跟音樂自己拍一次。'}
async function begin(preview=false){if(!pattern())return;stop();updateTempo();$('message').textContent='';const token=serial,custom=$('source').value==='custom';try{if(preview&&!custom)throw Error('對拍試聽只適用於自選音樂。');const cfg=validate(custom,preview?8:16);lock(true);await audioReady();if(token!==serial)return;const origin=ctx.currentTime+.15;run={pattern:pattern(),origin,spb:cfg.spb,preview,end:preview?8:20,events:timeline(pattern(),cfg.spb,custom,preview)};if(custom){let node=track(ctx.createBufferSource());node.buffer=audioBuffer;node.connect(musicBus);node.start(origin+(preview?0:4*cfg.spb),cfg.offset,(preview?8:16)*cfg.spb)}$('settings').open=false;frame()}catch(e){if(token!==serial)return;stop('尚未開始');$('message').textContent=e.message||'未能播放音樂，請重新載入。';$('settings').open=custom}}
function phase(t,preview=false){t+=1e-7;return preview?'preview':t<0?'ready':t<4?'count':t<12?'guided':t<20?'independent':'done'}
function frame(){if(!run)return;let r=run,t=(ctx.currentTime-r.origin)/r.spb,now=ctx.currentTime;for(let e of r.events){if(e.done)continue;if(e.time<=now-r.origin+.12){e.done=true;if(e.time>=now-r.origin-.025)emit(e,Math.max(now,r.origin+e.time),r.spb)}}let state=phase(t,r.preview);$('status').textContent=state==='preview'?'對拍試聽 · 聽拍子聲是否對齊音樂':state==='ready'?'準備':state==='count'?`預備拍 ${Math.floor(t)+1} / 4`:state==='guided'?'跟着拍 · 第一遍':'自己拍 · 第二遍';$('instruction').textContent=state==='independent'?'跟音樂看譜拍奏；休止也保留一拍。':state==='preview'?'若拍子未對齊，停止後調整 BPM 或第一拍位置。':(grade==='P3'?'先讀上行，再讀下行；二分拍一下，附點組合先長後短。':grade==='P5'?'先讀上行，再讀下行；留意一拍內的長短和均分。':'先讀上行，再讀下行；ti-ti 均分一拍。');document.querySelectorAll('.cell').forEach((c,i)=>c.classList.toggle('active',(state==='guided'||state==='independent')&&((t-4+1e-7)%8)>=r.pattern.segments[i].startBeat&&((t-4+1e-7)%8)<r.pattern.segments[i].startBeat+r.pattern.segments[i].durationBeats));showAssistance(r.pattern,(t-4)%8,$('assistance').checked&&(state==='guided'||state==='independent'));if(t+1e-7>=r.end){stop(r.preview?'試聽完成 · 可調整對拍設定':'完成 · 再練一次或下一題');return}raf=requestAnimationFrame(frame)}
async function loadFile(){stop('正在載入音樂…');let id=++loadSerial,file=$('file').files[0];audioBuffer=null;$('customBpm').value='';$('offset').value='';updateTempo();$('message').textContent='';$('fileInfo').textContent='';if(!file){$('status').textContent='先看譜，準備好才開始';return}loading=true;lock(false);try{await audioReady();const bytes=await file.arrayBuffer();let buffer=await ctx.decodeAudioData(bytes);if(id!==loadSerial)return;audioBuffer=buffer;$('fileInfo').textContent=`${file.name} · ${buffer.duration.toFixed(2)} 秒；請重新設定 BPM 和第一拍位置。`;$('status').textContent='音樂已載入 · 請設定並試聽'}catch(e){if(id!==loadSerial)return;$('message').textContent='無法解碼這個音樂檔，請改用瀏覽器支援的 MP3、M4A 或 WAV。';$('status').textContent='音樂未能載入'}finally{if(id===loadSerial){loading=false;lock(false)}}}
$('start').onclick=()=>begin();$('repeat').onclick=()=>begin();$('stop').onclick=()=>stop();$('preview').onclick=()=>begin(true);$('next').onclick=()=>{stop('先看譜，準備好才開始');$('question').selectedIndex=($('question').selectedIndex+1)%library().length;render()};$('question').onchange=()=>{stop('先看譜，準備好才開始');render()};$('source').onchange=()=>{stop('先看譜，準備好才開始');const custom=$('source').value==='custom';$('custom').hidden=!custom;$('builtin').hidden=custom;$('settings').open=custom;updateTempo()};$('file').onchange=loadFile;$('customBpm').oninput=updateTempo;for(let id of ['builtinBpm','customBpm','offset'])$(id).onchange=()=>{stop('設定已更新 · 按開始重新預備');updateTempo()};for(let [id,bus,label] of [['musicVolume',()=>musicBus,'musicValue'],['demoVolume',()=>demoBus,'demoValue']])$(id).oninput=()=>{$(label).textContent=$(id).value+'%';if(bus())bus().gain.value=Number($(id).value)/100};document.addEventListener('visibilitychange',()=>{if(document.hidden)stop('已停止 · 返回後按開始重新預備')});window.addEventListener('pagehide',()=>stop());for(const key of ['P2','P3','P5'])$('choose'+key).onclick=()=>selectGrade(key);$('changeGrade').onclick=goHome;$('backHome').onclick=goHome;updateTempo();
</script></html>
